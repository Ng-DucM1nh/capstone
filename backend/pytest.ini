[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: In-memory service and algorithmic unit tests
    api: HTTP route and contract tests via TestClient
    integration: Stateful database and infrastructure integration tests
    e2e: End-to-end full pipeline workflows
addopts = -v -rs --strict-markers
